name: Verificación PHP

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Verificar sintaxis PHP
        run: |
          find . -name "*.php" -print0 | xargs -0 -n1 php -l